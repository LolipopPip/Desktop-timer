<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Timer Bubble · GENREs">
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f9f5f0"/><stop offset=".54" stop-color="#eeeaf1"/><stop offset="1" stop-color="#dfe1ef"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#cca1be" stop-opacity=".45"/><stop offset="1" stop-color="#cca1be" stop-opacity="0"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".56" numOctaves="3" seed="8"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer></filter>
  </defs>
  <rect width="1200" height="460" rx="22" fill="url(#paper)"/><circle cx="976" cy="186" r="260" fill="url(#cloud)"/>
